<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>idang 릴스 올리기</title>
<style>
  :root{--p:#f36fa6;--pl:#ffe3ef;--ink:#3a2b33;--mut:#9a8590;--bg:#fff8fb}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #f6d6e4;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  header h1{font-size:18px;margin:0;color:var(--p)}
  header button{font-size:13px}
  main{max-width:560px;margin:0 auto;padding:16px 16px 80px}
  .card{background:#fff;border:1px solid #f6d6e4;border-radius:16px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 6px}
  input[type=text],input[type=password],input[type=number],input[type=search]{width:100%;padding:12px;border:1px solid #ecc9d8;border-radius:10px;font-size:16px;background:#fff}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pl);color:var(--ink);cursor:pointer}
  button.main{background:var(--p);color:#fff;width:100%;padding:15px;font-size:17px;font-weight:700}
  button:disabled{opacity:.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--pl);border-radius:20px;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
  .chip b{cursor:pointer;color:var(--p)}
  .res{max-height:220px;overflow:auto;margin-top:6px;border-radius:10px}
  .res div{padding:10px;border-bottom:1px solid #f9e3ec;font-size:14px;cursor:pointer}
  .res div:active{background:var(--pl)}
  .res small{color:var(--mut);margin-right:6px}
  video,img.pv{width:100%;max-height:60vh;border-radius:12px;background:#000;display:block}
  .bar{height:10px;border-radius:6px;background:#f6d6e4;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--p);transition:width .2s}
  .msg{font-size:14px;margin-top:8px;color:var(--mut);white-space:pre-line}
  .ok{color:#1b9e5a}.err{color:#d33}
  .row{display:flex;gap:8px;align-items:center}
  .list .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f9e3ec;align-items:center}
  .list img{width:54px;height:96px;object-fit:cover;border-radius:8px;background:#eee}
  .list .tx{flex:1;font-size:13px}
  .list .off{opacity:.4}
  .hide{display:none}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .quick button{font-size:13px;padding:7px 10px}
</style>
</head>
<body>
<header><h1>idang 릴스 올리기 🎀</h1><button id="logout" class="hide">로그아웃</button></header>
<main>
  <!-- 로그인 -->
  <section id="login" class="card">
    <h2>직원 코드</h2>
    <label>이름 (누가 올렸는지 기록돼요)</label>
    <input id="who" type="text" placeholder="예: 하림">
    <label>직원 코드</label>
    <input id="code" type="password" placeholder="대표님께 받은 코드">
    <div style="height:12px"></div>
    <button class="main" id="go">들어가기</button>
    <div class="msg" id="lmsg"></div>
  </section>

  <section id="app" class="hide">
    <div class="card">
      <h2>1. 어떤 상품 릴스칸에 넣을까요?</h2>
      <input id="q" type="search" placeholder="상품 이름 검색 (예: usagi, hime, jelly) 또는 상품번호">
      <div class="res" id="res"></div>
      <div class="quick" id="quick"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="card">
      <h2>2. 영상 고르기</h2>
      <input id="file" type="file" accept="video/*">
      <div style="height:10px"></div>
      <video id="pv" class="hide" playsinline muted controls></video>
      <label class="hide" id="tlab">첫 화면(썸네일)으로 쓸 장면 — 슬라이더로 고르세요</label>
      <input id="t" type="range" min="0" max="0" step="0.1" value="0" class="hide" style="width:100%">
      <label>영상 제목 (짧게)</label>
      <input id="title" type="text" maxlength="40" placeholder="예: 플리스우사기 셋업 착용">
    </div>

    <div class="card">
      <button class="main" id="up" disabled>올리기</button>
      <div class="bar"><i id="pg"></i></div>
      <div class="msg" id="umsg">영상 길이만큼(30초 영상이면 약 30초) 줄이는 시간이 걸려요. 그동안 화면을 켜 두세요.</div>
    </div>

    <div class="card list">
      <h2>최근 올린 릴스</h2>
      <div id="list"><div class="msg">불러오는 중…</div></div>
    </div>
  </section>
</main>

<script type="module">
/* ===== 설정 (Supabase) ===== */
const SUPA_URL = 'https://valklvrqjtbeoyizpxjf.supabase.co';   // 예: https://xxxx.supabase.co
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhbGtsdnJxanRiZW95aXpweGpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTg2NjMsImV4cCI6MjEwNzg5NDY2M30.vAMhQe2vITn4cohgfWFHEyqyTpE0GcTsfjXDhdRWuC8';  // anon public key
const FN = SUPA_URL + '/functions/v1/reels-staff';
const SEASON_GOODS = [800,801,802,803,804,805,806,807,808,809,810,811,812,813,814,815,816,817,818,819,820,821,822,823,824,825,826,827,828,829,830,855];

const $ = s => document.querySelector(s);
let CODE = localStorage.getItem('idang_reels_code') || '';
let WHO = localStorage.getItem('idang_reels_who') || '';
let PRODUCTS = [];           // [{idx,name}]
const picked = new Map();    // idx -> name
let file = null;

async function api(body){
  const r = await fetch(FN,{method:'POST',headers:{'content-type':'application/json',apikey:SUPA_ANON,Authorization:'Bearer '+SUPA_ANON},body:JSON.stringify({...body,code:CODE})});
  const j = await r.json().catch(()=>({error:'서버 응답 오류'}));
  if(!r.ok || j.error) throw new Error(j.error||('HTTP '+r.status));
  return j;
}

/* ---------- 로그인 ---------- */
$('#who').value = WHO;
async function enter(){
  if(!SUPA_URL){ $('#lmsg').textContent='아직 서버 연결 전이에요. (설정 필요)'; return; }
  try{ await api({action:'check'}); }catch(e){ $('#lmsg').innerHTML='<span class="err">'+e.message+'</span>'; localStorage.removeItem('idang_reels_code'); return; }
  localStorage.setItem('idang_reels_code',CODE); localStorage.setItem('idang_reels_who',WHO);
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#logout').classList.remove('hide');
  loadProducts(); loadList();
}
$('#go').onclick = ()=>{ CODE=$('#code').value.trim(); WHO=$('#who').value.trim(); if(!WHO){$('#lmsg').textContent='이름을 적어 주세요';return;} enter(); };
$('#logout').onclick = ()=>{ localStorage.removeItem('idang_reels_code'); location.reload(); };
if(CODE && WHO) enter();

/* ---------- 상품 고르기 ---------- */
async function loadProducts(){
  try{ const c=JSON.parse(localStorage.getItem('idang_reels_products')||'null'); if(c&&Date.now()-c.at<6*3600e3) PRODUCTS=c.products; }catch(e){}
  if(!PRODUCTS.length){ $('#res').innerHTML='<div class="msg">상품 목록 불러오는 중… (처음 한 번은 30초쯤 걸려요)</div>'; try{ const o=await api({action:'products'}); PRODUCTS=o.products; localStorage.setItem('idang_reels_products',JSON.stringify(o)); }catch(e){ PRODUCTS=[]; } $('#res').innerHTML=''; }
  const qk=$('#quick');
  const b=document.createElement('button'); b.textContent='＋ 이번 시즌 굿즈 공통 ('+SEASON_GOODS.length+'개)';
  b.onclick=()=>{ SEASON_GOODS.forEach(n=>picked.set(n,nameOf(n))); chips(); };
  qk.appendChild(b);
}
const nameOf = n => (PRODUCTS.find(p=>p.idx===n)||{}).name || ('상품 '+n);
$('#q').oninput = ()=>{
  const q=$('#q').value.trim().toLowerCase(); const res=$('#res'); res.innerHTML='';
  if(!q) return;
  let list = /^\d+$/.test(q) ? [{idx:+q,name:nameOf(+q)}] : PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,30);
  if(/^\d+$/.test(q) && !PRODUCTS.find(p=>p.idx===+q)){ api({action:'name',idx:+q}).then(o=>{ const d=res.querySelector('div'); if(d&&$('#q').value.trim()===q){ const nm=o.name||('숨김 상품 '+q); d.innerHTML='<small>'+q+'</small>'+nm; d.onclick=()=>{picked.set(+q,nm); $('#q').value=''; res.innerHTML=''; chips();}; } }).catch(()=>{}); }
  list.forEach(p=>{const d=document.createElement('div'); d.innerHTML='<small>'+p.idx+'</small>'+p.name; d.onclick=()=>{picked.set(p.idx,p.name); $('#q').value=''; res.innerHTML=''; chips();}; res.appendChild(d);});
  if(!list.length) res.innerHTML='<div class="msg">없어요. 숨김 상품이면 상품번호를 숫자로 입력하세요.</div>';
};
function chips(){
  const c=$('#chips'); c.innerHTML='';
  if(picked.size>8){ const s=document.createElement('span'); s.className='chip'; s.innerHTML=picked.size+'개 상품 선택됨 <b>전체 지우기</b>'; s.querySelector('b').onclick=()=>{picked.clear();chips();}; c.appendChild(s); }
  else picked.forEach((n,i)=>{const s=document.createElement('span'); s.className='chip'; s.innerHTML=i+' '+n+' <b>✕</b>'; s.querySelector('b').onclick=()=>{picked.delete(i);chips();}; c.appendChild(s);});
  ready();
}

/* ---------- 영상 ---------- */
const pv=$('#pv');
$('#file').onchange = e=>{
  file=e.target.files[0]; if(!file) return;
  pv.src=URL.createObjectURL(file); pv.classList.remove('hide'); $('#tlab').classList.remove('hide'); $('#t').classList.remove('hide');
  pv.onloadedmetadata=()=>{ $('#t').max=Math.max(0,pv.duration-0.1).toFixed(1); $('#t').value=Math.min(1,pv.duration/2).toFixed(1); pv.currentTime=+$('#t').value; ready(); };
};
$('#t').oninput = ()=>{ pv.currentTime=+$('#t').value; };
$('#title').oninput = ready;
function ready(){ $('#up').disabled = !(file && picked.size && $('#title').value.trim()); }

function prog(p,m){ $('#pg').style.width=Math.round(p*100)+'%'; if(m) $('#umsg').textContent=m; }

/* 화면에 맞춘 720x1280 (꽉 채우고 가운데 자르기) */
function drawCover(ctx,v,W,H){ const s=Math.max(W/v.videoWidth,H/v.videoHeight); const w=v.videoWidth*s,h=v.videoHeight*s; ctx.drawImage(v,(W-w)/2,(H-h)/2,w,h); }

async function posterBlob(t){
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.src=URL.createObjectURL(file);
  await new Promise(r=>v.onloadeddata=r); v.currentTime=Math.min(t,Math.max(0,v.duration-0.1)); await new Promise(r=>v.onseeked=r);
  const c=document.createElement('canvas'); c.width=720; c.height=1280; drawCover(c.getContext('2d'),v,720,1280);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
}

async function compress(onp){
  if(!('VideoEncoder' in window)) return null;            // 지원 안 하면 원본 업로드
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/+esm');
  const W=720,H=1280;
  let cfg={codec:'avc1.4d0028',width:W,height:H,bitrate:2_500_000,framerate:30};
  if(!(await VideoEncoder.isConfigSupported(cfg)).supported){ cfg={...cfg,codec:'avc1.42001f'}; if(!(await VideoEncoder.isConfigSupported(cfg)).supported) return null; }
  const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
  let encErr=null;
  const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{encErr=e;}});
  enc.configure(cfg);
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.src=URL.createObjectURL(file);
  await new Promise(r=>v.onloadeddata=r);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d');
  let n=0,last=-1;
  const grab=(ts)=>{ if(ts<=last) return; last=ts; drawCover(ctx,v,W,H); const f=new VideoFrame(c,{timestamp:ts}); enc.encode(f,{keyFrame:n%60===0}); f.close(); n++; onp(Math.min(.99,v.currentTime/v.duration)); };
  await new Promise((res,rej)=>{
    v.onended=res; v.onerror=()=>rej(new Error('영상을 읽을 수 없어요'));
    if('requestVideoFrameCallback' in v){ const loop=(now,meta)=>{ grab(Math.round(meta.mediaTime*1e6)); if(!v.ended) v.requestVideoFrameCallback(loop); }; v.requestVideoFrameCallback(loop); }
    else { const t=setInterval(()=>{ if(v.ended){clearInterval(t);return;} grab(Math.round(v.currentTime*1e6)); },33); }
    v.play().catch(rej);
  });
  await enc.flush(); if(encErr) throw encErr; muxer.finalize();
  if(n<10) return null;
  return new Blob([muxer.target.buffer],{type:'video/mp4'});
}

async function put(sig,blob,type){
  const r=await fetch(sig.url,{method:'PUT',headers:{'content-type':type},body:blob});
  if(!r.ok) throw new Error('업로드 실패 ('+r.status+')');
}

$('#up').onclick = async ()=>{
  const btn=$('#up'); btn.disabled=true;
  try{
    prog(0.02,'썸네일 만드는 중…');
    const poster=await posterBlob(+$('#t').value);
    prog(0.05,'영상 줄이는 중… 화면을 켜 두세요');
    let video=null;
    try{ video=await compress(p=>prog(0.05+p*0.75)); }catch(e){ console.warn(e); video=null; }
    if(!video){
      if(file.size>45*1024*1024) throw new Error('이 폰에서는 영상을 줄일 수 없어서 원본을 올려야 하는데 45MB가 넘어요. 짧게 잘라서 다시 올려 주세요.');
      video=file;
    }
    prog(0.82,'올리는 중…');
    const s=await api({action:'sign'});
    await put(s.video,video,'video/mp4');
    await put(s.poster,poster,'image/jpeg');
    const products=[...picked].map(([i,n])=>[n,i]);
    await api({action:'create',id:s.id,products,title:$('#title').value.trim(),video_path:s.video.path,poster_path:s.poster.path,uploader:WHO});
    prog(1,''); $('#umsg').innerHTML='<span class="ok">올렸어요! 4개 몰 상품 페이지에 바로 떠요 ('+Math.round(video.size/1024/1024*10)/10+'MB)</span>';
    file=null; $('#file').value=''; pv.classList.add('hide'); $('#t').classList.add('hide'); $('#tlab').classList.add('hide'); $('#title').value=''; picked.clear(); chips();
    loadList();
  }catch(e){ $('#umsg').innerHTML='<span class="err">'+e.message+'</span>'; prog(0); btn.disabled=false; }
};

/* ---------- 최근 목록 (숨기기/다시 보이기) ---------- */
async function loadList(){
  const L=$('#list');
  try{
    const {rows}=await api({action:'list'});
    if(!rows.length){ L.innerHTML='<div class="msg">아직 없어요</div>'; return; }
    L.innerHTML='';
    rows.slice(0,40).forEach(r=>{
      const d=document.createElement('div'); d.className='it'+(r.active?'':' off');
      const ps=(r.products||[]); const pn=ps.length>3?ps.slice(0,3).map(p=>p[0]).join(', ')+' 외 '+(ps.length-3)+'개':ps.map(p=>p[0]).join(', ');
      d.innerHTML='<img src="'+(r.poster_url||'')+'"><div class="tx"><b>'+(r.title||'')+'</b><br>'+pn+'<br><span style="color:#9a8590">'+(r.uploader||'')+' · '+r.created_at.slice(0,10)+(r.active?'':' · 숨김')+'</span></div>';
      const b=document.createElement('button'); b.textContent=r.active?'숨기기':'다시 보이기';
      b.onclick=async()=>{ b.disabled=true; try{ await api({action:'update',id:r.id,active:!r.active}); loadList(); }catch(e){ alert(e.message); b.disabled=false; } };
      d.appendChild(b); L.appendChild(d);
    });
  }catch(e){ L.innerHTML='<div class="msg err">'+e.message+'</div>'; }
}
</script>
</body>
</html>
